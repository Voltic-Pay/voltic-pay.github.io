<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voltic - Payment link</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="description" content="This payment link opens in the Voltic app. Download Voltic to complete the transfer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #dbdbdb;
    --ink: #050505;
    --soft: #050505b3;
    --line: #05050533;
    --gold: #ffb800;
    --gold-deep: #e5a400;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom, 0px));
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--gold-deep); outline-offset: 3px; border-radius: 8px; }

  .page { width: 100%; max-width: 520px; text-align: center; }

  .mark { width: 84px; height: 84px; display: block; margin: 0 auto 22px; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    font: 500 .74rem 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: .12em; text-transform: uppercase;
    color: var(--soft); margin-bottom: 18px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 0 rgba(255,184,0,.55);
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,184,0,.55); }
    100% { box-shadow: 0 0 0 10px rgba(255,184,0,0); }
  }

  h1 {
    font: 700 clamp(2rem, 6.4vw, 2.7rem) 'Space Grotesk', ui-sans-serif, sans-serif;
    line-height: 1.05; letter-spacing: -.015em;
    margin: 0 auto; max-width: 14ch;
  }
  .lede {
    margin: 18px auto 0; font-size: 1.05rem; line-height: 1.55;
    color: var(--soft); max-width: 40ch;
  }

  .cta {
    margin-top: 34px;
    display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 15px 28px; border-radius: 999px;
    font-size: .98rem; font-weight: 600; text-decoration: none;
    transition: background-color .2s ease, transform .1s ease;
    -webkit-tap-highlight-color: transparent;
    border: 1px solid transparent;
  }
  .btn:active { transform: scale(.97); }
  .btn-gold { background: var(--gold); color: var(--ink); border-color: transparent; }
  .btn-gold:hover { background: var(--gold-deep); }
  .btn-line { color: var(--ink); border-color: var(--line); }
  .btn-line:hover { background: rgba(5,5,5,.06); }
  .btn svg { width: 18px; height: 18px; flex: none; }

  .fine {
    margin: 34px 0 0;
    font: 500 .72rem 'JetBrains Mono', ui-monospace, monospace;
    letter-spacing: .1em; text-transform: uppercase;
    color: var(--soft);
  }
  .fine span { margin: 0 6px; opacity: .5; }

  .rise { animation: rise .8s cubic-bezier(.22,1,.36,1) both; }
  .rise.d1 { animation-delay: .06s; }
  .rise.d2 { animation-delay: .12s; }
  .rise.d3 { animation-delay: .18s; }
  .rise.d4 { animation-delay: .24s; }
  .rise.d5 { animation-delay: .30s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) {
    .rise, .eyebrow .dot { animation: none; }
  }

  @media (max-width: 480px) {
    .mark { width: 68px; height: 68px; }
    .lede { font-size: 1rem; }
    .cta { flex-direction: column; }
    .cta .btn { width: 100%; }
  }
</style>
</head>
<body>

<main class="page">

  <svg class="mark rise" viewBox="0 0 108 108" aria-label="Voltic">
    <g transform="translate(54,54)">
      <path fill="#ffb800" d="M 0,-30 L -18,0 L 0,-5 Z"/>
      <path fill="#050505" d="M 0,-30 L 18,0 L 0,0 Z"/>
      <path fill="#ffb800" d="M -18,0 L 6,0 L 18,0 L 0,-6 Z"/>
      <path fill="#050505" d="M -18,3 L 0,9 L 0,28 Z"/>
      <path fill="#e5a400" d="M 0,5 L 18,0 L 0,28 Z"/>
      <path fill="#ffb800" d="M -18,0 L 6,0 L 18,0 L 0,6 Z"/>
    </g>
  </svg>

  <div class="eyebrow rise d1"><span class="dot"></span>Payment link</div>

  <h1 class="rise d2">You need Voltic to pay.</h1>

  <p class="lede rise d3">
    This link opens in the Voltic app. Tap over NFC or scan a QR code - straight from your wallet to theirs. No custodian, no forms, no middleman.
  </p>

  <div class="cta rise d4">
    <a class="btn btn-gold" href="https://github.com/Voltic-Pay/Voltic-App/releases">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3v12"/>
        <path d="m7 10 5 5 5-5"/>
        <path d="M5 21h14"/>
      </svg>
      Download Voltic
    </a>
    <a class="btn btn-line" href="/">
      Learn more
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14"/>
        <path d="m12 5 7 7-7 7"/>
      </svg>
    </a>
  </div>

  <p class="fine rise d5">
    Self-custodial <span>·</span> Easy 2 use <span>·</span> GPL-3.0
  </p>

</main>

</body>
</html>
